name: CI

on:
  push:
    branches-ignore: ["gh-pages", "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the last step pushes logs and screenshots to a throw-away ci/run-* branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
      - name: Unit tests (pipeline, metrics, auth policy, storage)
        run: set -o pipefail; mkdir -p ci-out; npm test 2>&1 | tee ci-out/unit.log
      - name: WordPress plugin (PHP lint + plain-PHP tests)
        run: |
          set -o pipefail
          mkdir -p ci-out
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | tee ci-out/php.log
          for t in wordpress/tests/*-test.php; do php "$t" 2>&1 | tee -a ci-out/php.log; done
      # early for fast feedback; a failure is reported by the last step so the website checks still run
      - name: WordPress image builds
        id: wpbuild
        if: github.event_name == 'push'
        continue-on-error: true
        run: set -o pipefail; mkdir -p ci-out; docker build --progress=plain -t nymbus-wp:ci wordpress 2>&1 | tail -60 | tee ci-out/docker-wp.log
      - name: WordPress image smoke test (hardening, sign-in, plugins, content endpoint)
        id: wpsmoke
        if: github.event_name == 'push'
        continue-on-error: true
        run: set -o pipefail; bash wordpress/tests/docker-smoke.sh nymbus-wp:ci 2>&1 | tee ci-out/docker-wp-smoke.log
      - name: Type check
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-out/typecheck.log
      - name: Lint
        run: set -o pipefail; npm run lint 2>&1 | tee ci-out/lint.log
        continue-on-error: true
      - name: Build
        run: set -o pipefail; npm run build 2>&1 | tee ci-out/build.log
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (public pages, admin gate, API guards, screenshots)
        run: set -o pipefail; npm run e2e 2>&1 | tee ci-out/e2e.log
        env:
          SHOW_SAMPLE_DATA: "1"
      - name: Docker image builds
        if: always() && github.event_name == 'push'
        run: set -o pipefail; docker build -t nymbus-web:ci . 2>&1 | tail -40 | tee ci-out/docker.log
      - name: WordPress image result (build + smoke test above)
        if: always() && github.event_name == 'push'
        run: |
          echo "build: ${{ steps.wpbuild.outcome }}, smoke test: ${{ steps.wpsmoke.outcome }}"
          [ "${{ steps.wpbuild.outcome }}" = success ] && [ "${{ steps.wpsmoke.outcome }}" = success ]
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
            e2e/screenshots/
          retention-days: 7
      - name: Publish logs and screenshots to a ci/run-* branch (artifact storage is not reachable from the dev sandbox)
        # opt-in: add [ci-logs] to the commit message
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-logs]')
        run: |
          set +e
          mkdir -p /tmp/ci-pub && cd /tmp/ci-pub
          git init -q && git checkout -q -b "ci/run-${{ github.run_number }}"
          cp -r "$GITHUB_WORKSPACE/ci-out" . 2>/dev/null
          mkdir -p screenshots && cp -r "$GITHUB_WORKSPACE/e2e/screenshots/." screenshots/ 2>/dev/null
          find "$GITHUB_WORKSPACE/test-results" -name "*.png" -size -2M -exec cp {} screenshots/ \; 2>/dev/null
          find "$GITHUB_WORKSPACE/test-results" -name "error-context.md" | while read f; do d=$(basename "$(dirname "$f")"); cp "$f" "ci-out/$d.md"; done
          cp "$GITHUB_WORKSPACE/package-lock.json" . 2>/dev/null
          echo "${{ github.sha }}" > SHA
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI run ${{ github.run_number }} for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD

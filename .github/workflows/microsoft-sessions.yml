name: Microsoft session recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  session-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/session-recovery.test.mjs

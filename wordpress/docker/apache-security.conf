# Nymbus WordPress: Apache hardening (enabled by wordpress/Dockerfile).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# XML-RPC is not used (and is a classic password-guessing door): refused before PHP runs.
<Files "xmlrpc.php">
    Require all denied
</Files>

# Uploads (volume): pictures only. No script ever executes from here, whatever its name, and a .htaccess written
# into the folder cannot switch anything back on.
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "(?i)\.(php[0-9]?|pht|phtml|phar|phps|cgi|pl|py|sh|shtml)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
